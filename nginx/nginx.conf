# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Load Balancer config
# Pertemuan 2: Containerization (Docker)
# Kelompok 1, Cloud Computing H7D.7
#
# Arsitektur: 2 backend Node.js di-load-balance oleh Nginx (round-robin)
# Sesuai Spesifikasi Arsitektur v1.2, §4.2
# ─────────────────────────────────────────────────────────────────────────────

upstream flashsale_backend {
    # Round-robin ke 2 instance backend
    server backend-1:3000;
    server backend-2:3000;

    # Keepalive connection pool ke backend
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Log akses dan error
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Timeout & buffer
    proxy_connect_timeout    5s;
    proxy_read_timeout       60s;
    proxy_send_timeout       60s;
    proxy_buffering          off;

    # Header yang diteruskan ke backend
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Proxy semua request ke upstream backend
    location / {
        proxy_pass http://flashsale_backend;
    }

    # Endpoint health khusus Nginx (tidak proxy ke backend)
    location /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }
}
