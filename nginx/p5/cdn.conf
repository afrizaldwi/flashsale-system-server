proxy_cache_path /var/cache/nginx/cdn
  levels=1:2
  keys_zone=cdn_cache:10m
  max_size=512m
  inactive=10m
  use_temp_path=off;

server {
  listen 80;
  server_name _;

  # --- CDN / asset endpoint (file statis dari volume) ---------
  location /assets/ {
    root /usr/share/nginx/html;

    # Aktifkan open_file_cache untuk performa
    open_file_cache          max=1000 inactive=5m;
    open_file_cache_valid    5m;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;

    # Header CDN identitas
    add_header X-CDN-Node    "cdn-edge-1" always;
    add_header X-Cache-Status "HIT" always;   # selalu dari disk/cache Nginx

    expires 5m;
    access_log /var/log/nginx/cdn.access.log;
  }

  # health check
  location = /cdn-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "cdn-edge ok\n";
  }

  location / {
    return 404 "not found\n";
  }
}
