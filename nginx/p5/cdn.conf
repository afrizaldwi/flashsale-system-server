proxy_cache_path /var/cache/nginx/cdn
  levels=1:2
  keys_zone=cdn_cache:10m
  max_size=512m
  inactive=10m
  use_temp_path=off;

server {
  listen 80;
  server_name _;

  # --- CDN / asset endpoint ---
  location /assets/ {
    proxy_pass         http://minio:9000/flashsale/;
    proxy_set_header   Host minio;
    proxy_set_header   X-Real-IP $remote_addr;

    proxy_cache        cdn_cache;
    proxy_cache_valid  200 206 5m;
    proxy_cache_valid  404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock   on;

    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-CDN-Node    "cdn-edge-1" always;

    expires 5m;
    access_log /var/log/nginx/cdn.access.log;
  }

  # --- MinIO Console proxy (opsional, debug) ---
  location /minio-console/ {
    proxy_pass         http://minio:9001/;
    proxy_set_header   Host minio;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
  }

  # health check
  location = /cdn-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "cdn-edge ok\n";
  }

  location / {
    return 404 "not found\n";
  }
}

