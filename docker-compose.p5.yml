name: flashsale-p5

# ============================================================
#  Pertemuan 5 – File Management & CDN berbasis Docker
#  CDN Edge: Nginx standalone (tanpa MinIO, file dari volume)
# ============================================================
#
#  Arsitektur:
#    Browser → :8080 (Nginx LB + API) ← P3 stack
#    Browser → :8081 (CDN Edge)       ← server file statis dari volume
#
#  Cara pakai:
#    npm run p5:start          → mulai CDN Edge
#    npm run p5:upload-assets  → salin gambar ke volume cdn-assets
#    npm run p5:stress-before  → k6 test SEBELUM CDN (via backend :8080)
#    npm run p5:stress-after   → k6 test SETELAH CDN (via cdn-edge :8081)
# ============================================================

services:

  # ── CDN Edge Node (Nginx + volume lokal sebagai "object storage") ───────────
  cdn-edge:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/p5/cdn.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/images:/usr/share/nginx/html/assets/products:ro
      - cdn-cache:/var/cache/nginx/cdn
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1/cdn-health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [p3, p5]
    labels:
      flashsale.environment: p5
      flashsale.role: cdn-edge

networks:
  p3:
    external: true
    name: flashsale-p3_p3
  p5:
    labels: { flashsale.environment: p5 }

volumes:
  cdn-cache:
    labels: { flashsale.environment: p5 }
