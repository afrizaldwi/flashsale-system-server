# ─────────────────────────────────────────────────────────────────────────────
# docker/primary-pg_hba.conf
# Aturan autentikasi PostgreSQL PRIMARY untuk Docker
# Pertemuan 2: Containerization (Docker)
# Kelompok 1, Cloud Computing H7D.7
# ─────────────────────────────────────────────────────────────────────────────
# TYPE  DATABASE        USER            ADDRESS                 METHOD
# ─────────────────────────────────────────────────────────────────────────────

# Koneksi lokal (dalam container)
local   all             all                                     trust

# Koneksi IPv4 lokal
host    all             all             127.0.0.1/32            trust

# Koneksi IPv6 lokal
host    all             all             ::1/128                 trust

# Izinkan koneksi aplikasi dari subnet Docker internal (172.16.0.0/12)
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256

# Izinkan replikasi dari user replicator dari subnet Docker
# (replica container akan melakukan pg_basebackup dan streaming WAL)
host    replication     replicator      172.16.0.0/12           scram-sha-256
host    replication     replicator      192.168.0.0/16          scram-sha-256
host    replication     replicator      10.0.0.0/8              scram-sha-256

# Izinkan koneksi postgres dari mana saja untuk keperluan debugging Docker
# (JANGAN dipakai di produksi — batasi ke IP spesifik)
host    all             postgres        0.0.0.0/0               scram-sha-256
