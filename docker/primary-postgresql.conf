# ─────────────────────────────────────────────────────────────────────────────
# docker/primary-postgresql.conf
# Konfigurasi PostgreSQL 16 PRIMARY untuk Docker
# Pertemuan 2: Containerization (Docker)
# Kelompok 1, Cloud Computing H7D.7
# ─────────────────────────────────────────────────────────────────────────────

# ── Koneksi ──────────────────────────────────────────────────────────────────
listen_addresses = '*'
max_connections = 100
port = 5432

# ── Memori ───────────────────────────────────────────────────────────────────
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB

# ── WAL & Replikasi Streaming ─────────────────────────────────────────────────
# Wajib untuk streaming replication ke replica (Arsitektur §4.2)
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 64MB
hot_standby = on

# Konfirmasi replikasi (opsional, non-blocking untuk performa)
synchronous_commit = on

# ── Checkpoint & WAL ─────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
wal_compression = on

# ── Logging ──────────────────────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off
log_connections = off
log_disconnections = off
log_duration = off
log_min_duration_statement = 1000
log_line_prefix = '%t [%p] %u@%d '

# ── Lokalisasi ────────────────────────────────────────────────────────────────
datestyle = 'iso, mdy'
timezone = 'Asia/Jakarta'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
