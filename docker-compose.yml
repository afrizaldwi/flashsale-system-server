# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml
# Pertemuan 2: Containerization (Docker)
# Kelompok 1, Cloud Computing H7D.7
#
# Arsitektur multi-container sesuai Spesifikasi Arsitektur v1.2, §4.2:
#
#   Browser
#     │  HTTP :80
#     ▼
#   [nginx]          — Nginx load balancer (round-robin)
#     ├── [backend-1] — Node.js Flash Sale API (instance 1)
#     └── [backend-2] — Node.js Flash Sale API (instance 2)
#           │
#     ┌─────┴────────────────────────┐
#     ▼                              ▼
# [db-primary] :5432            [db-replica] :5432
#  PostgreSQL PRIMARY             PostgreSQL HOT STANDBY
#  (writes & reads)               (reads only, streaming replication)
#
# Volumes untuk persistensi data (fondasi DRP Pertemuan 4):
#   - pgdata-primary  → data PostgreSQL primary
#   - pgdata-replica  → data PostgreSQL replica
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL PRIMARY ──────────────────────────────────────────────────────
  db-primary:
    image: postgres:16-alpine
    container_name: flashsale-db-primary
    restart: unless-stopped
    env_file: .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Izinkan replication dari subnet docker internal
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    volumes:
      # Volume persisten untuk data primary (fondasi DRP)
      - pgdata-primary:/var/lib/postgresql/data
      # Script inisialisasi: buat user replicator, schema, dan seed data
      - ./docker/primary-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Custom postgresql.conf untuk mengaktifkan WAL streaming replication
      - ./docker/primary-postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # Custom pg_hba.conf untuk mengizinkan replication dari container replica
      - ./docker/primary-pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      # Expose ke host untuk debugging lokal (opsional)
      - "5432:5432"
    networks:
      - flashsale-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashsale"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── PostgreSQL REPLICA (Hot Standby) ────────────────────────────────────────
  db-replica:
    image: postgres:16-alpine
    container_name: flashsale-db-replica
    restart: unless-stopped
    # env_file provides: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
    #                    REPLICATION_USER, REPLICATION_PASSWORD
    env_file: .env.docker
    environment:
      # Static values — tidak pakai interpolasi ${} untuk hindari masalah host env
      PRIMARY_HOST: db-primary
      PRIMARY_PORT: "5432"
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Volume persisten untuk data replica (fondasi DRP)
      - pgdata-replica:/var/lib/postgresql/data
      # Entrypoint custom yang menjalankan pg_basebackup
      - ./docker/replica-entrypoint.sh:/docker-replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-replica-entrypoint.sh"]
    ports:
      # Expose ke host di port berbeda untuk debugging
      - "5433:5432"
    networks:
      - flashsale-net
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashsale"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Backend Instance 1 ──────────────────────────────────────────────────────
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: flashsale-api:latest
    container_name: flashsale-backend-1
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PORT: 3000
      DB_HOST: db-primary
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_MAX: 20
      DB_REPLICA_HOST: db-replica
      DB_REPLICA_PORT: 5432
    networks:
      - flashsale-net
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Backend Instance 2 ──────────────────────────────────────────────────────
  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: flashsale-api:latest
    container_name: flashsale-backend-2
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PORT: 3000
      DB_HOST: db-primary
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_MAX: 20
      DB_REPLICA_HOST: db-replica
      DB_REPLICA_PORT: 5432
    networks:
      - flashsale-net
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Nginx Load Balancer ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: flashsale-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Port utama yang diakses pengguna/browser
      - "80:80"
    networks:
      - flashsale-net
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Networks ────────────────────────────────────────────────────────────────
networks:
  flashsale-net:
    driver: bridge
    name: flashsale-network

# ── Volumes (Persistensi Data — Fondasi DRP Pertemuan 4) ───────────────────
volumes:
  pgdata-primary:
    name: flashsale-pgdata-primary
    driver: local
  pgdata-replica:
    name: flashsale-pgdata-replica
    driver: local
